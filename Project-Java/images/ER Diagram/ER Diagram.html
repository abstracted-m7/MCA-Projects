
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2e2c45' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#083529' : '#E1F5EE',
    secondaryBorderColor: dark ? '#0F6E56' : '#0F6E56',
    tertiaryColor: dark ? '#3b1f14' : '#FAECE7',
    tertiaryBorderColor: dark ? '#993C1D' : '#993C1D',
  },
});

const diagram = `erDiagram
  DEPARTMENT {
    int dept_id PK
    string dept_name
    string location
    string manager_name
  }

  EMPLOYEE {
    int emp_id PK
    string emp_name
    string email
    string designation
    double salary
    int dept_id FK
    int sync_status_id FK
  }

  PRODUCT {
    int product_id PK
    string product_name
    string category
    double price
    int stock_quantity
    int dept_id FK
    int sync_status_id FK
  }

  ORDER_RECORD {
    int order_id PK
    date order_date
    double total_amount
    string order_status
    int emp_id FK
    int product_id FK
    int sync_status_id FK
  }

  SYNC_STATUS {
    int sync_status_id PK
    string status_label
    timestamp last_synced_at
    string synced_by
    boolean is_dirty
  }

  SYNC_LOG {
    int log_id PK
    string entity_type
    int entity_id
    string operation
    timestamp synced_at
    string result
  }

  DEPARTMENT ||--o{ EMPLOYEE : "employs"
  DEPARTMENT ||--o{ PRODUCT : "manages"
  EMPLOYEE ||--o{ ORDER_RECORD : "places"
  PRODUCT ||--o{ ORDER_RECORD : "included in"
  SYNC_STATUS ||--o{ EMPLOYEE : "tracks"
  SYNC_STATUS ||--o{ PRODUCT : "tracks"
  SYNC_STATUS ||--o{ ORDER_RECORD : "tracks"
  SYNC_LOG }o--|| EMPLOYEE : "logs"
  SYNC_LOG }o--|| PRODUCT : "logs"
  SYNC_LOG }o--|| ORDER_RECORD : "logs"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
